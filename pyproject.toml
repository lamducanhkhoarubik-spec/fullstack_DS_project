[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fullstack_ds_project"
version = "0.1.0"
description = "Customer Segmentation and RFM Analysis Library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "openpyxl>=3.1.0",
    "scikit-learn>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "src/clustering_library"
]
testpaths = ["tests"]

[tool.ruff]
line-length = 88